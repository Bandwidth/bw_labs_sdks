name: Publish package

on:
  workflow_dispatch:
    inputs:
      language:
        description: Package to build and publish
        required: true
        type: choice
        options:
          - typescript
          - python

concurrency:
  group: publish-${{ inputs.language }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-typescript:
    if: inputs.language == 'typescript' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: typescript/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-typescript:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validate-typescript
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: package
      - run: npm publish ./package/*.tgz --ignore-scripts --access public --provenance

  validate-python:
    if: inputs.language == 'python' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-asyncio ruff mypy build twine
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package
          path: python/dist/*
          if-no-files-found: error
          retention-days: 1

  publish-python:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validate-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
