name: Publish package

on:
  workflow_dispatch:
    inputs:
      language:
        description: Package to build and publish
        required: true
        type: choice
        options:
          - typescript
          - python

concurrency:
  group: publish-${{ inputs.language }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  #validate-ref:
  #  runs-on: ubuntu-latest
  #  steps:
  #    - name: Require the default branch
  #      env:
  #        REF_NAME: ${{ github.ref_name }}
  #        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  #      run: |
  #        if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
  #          echo "::error::Packages can only be published from $DEFAULT_BRANCH."
  #          exit 1
  #        fi

  publish-typescript:
    if: inputs.language == 'typescript'
    #needs: validate-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build package
        id: package
        run: |
          npm pack
          shopt -s nullglob
          PACKAGE_FILES=(*.tgz)
          if [ "${#PACKAGE_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected npm pack to create exactly one tarball."
            exit 1
          fi
          PACKAGE_FILE="${PACKAGE_FILES[0]}"
          echo "filename=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
      - name: Publish package to npm
        run: npm publish "${{ steps.package.outputs.filename }}" --access public --provenance

  publish-python:
    if: inputs.language == 'python'
    #needs: validate-ref
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
